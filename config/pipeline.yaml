# Configuración del pipeline de análisis del saque kick (video -> MediaPipe -> cinemática).
# Las rutas son relativas a la raíz del proyecto.

subject:
  height_m: 1.64
  body_mass_kg: 58.0
  foot_length_m: 0.25
  hitting_side: der            # der | izq

paths:
  raw_video: data/raw/video
  pose: data/interim/pose
  processed: data/processed
  reports: reports

pose:
  model: heavy                 # lite | full | heavy (se descarga a models/ si no existe)
  model_dir: models
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  min_visibility: 0.5          # landmarks con menor visibilidad se tratan como hueco

# Parámetros comunes de detección de estampitas (cada vista puede sobrescribirlos).
stickers:
  hsv_low: [22, 110, 70]
  hsv_high: [48, 255, 255]
  search_radius_px: 90
  min_area_px: 25
  max_area_px: 1500
  min_circularity: 0.35
  max_offset_mad: 4.0          # descarta detecciones cuyo desfase al landmark es atípico

views:
  lateral:
    video: lateral.mp4
    # Vara de 1 m: extremo superior e inferior en píxeles (imagen ya rotada, 1080x1920).
    # Medido en el fotograma 150; verificar con `saque calibrate lateral`.
    # ground_plane: lleva la escala de la vara al plano de la jugadora con la altura de cámara
    # (la vara y la jugadora no están a la misma distancia de la cámara). pole = escala de la vara.
    calibration: {method: ground_plane, p_top: [990, 1174], p_bottom: [980, 1745], length_m: 1.0,
                  camera_height_m: 1.30}
    # Landmarks con estampita visible y fiable en esta vista (lado de golpeo).
    # De perfil las dos caderas se superponen: la estampita visible se asigna a la del lado de golpeo.
    stickers: [hombro_der, codo_der, muneca_der, cadera_der, rodilla_der, tobillo_der, punta_der]
    segments:
      tronco: [cadera_der, hombro_der]
      brazo: [hombro_der, codo_der]
      antebrazo: [codo_der, muneca_der]
      muslo: [cadera_der, rodilla_der]
      pierna: [rodilla_der, tobillo_der]
      pie: [tobillo_der, punta_der]
    joints:
      hombro: [cadera_der, hombro_der, codo_der]      # elevación brazo-tronco
      codo: [hombro_der, codo_der, muneca_der]
      cadera: [hombro_der, cadera_der, rodilla_der]
      rodilla: [cadera_der, rodilla_der, tobillo_der]
      tobillo: [rodilla_der, tobillo_der, punta_der]
    linear: [hombro_der, codo_der, muneca_der, cadera_der, rodilla_der, tobillo_der]
    jacobian: {upper: brazo, fore: antebrazo, shoulder: hombro_der, elbow: codo_der,
               wrist: muneca_der}
    ball: {roi_y_max_px: 1100, max_start_y_px: 450}
  posterior:
    video: posterior.mp4
    # La vara (línea de fondo) está más lejos de la cámara que la jugadora: sin corrección de
    # profundidad la estatura aparente sale ~2.3 m. ground_plane la corrige.
    calibration: {method: ground_plane, p_top: [500, 872], p_bottom: [520, 1318], length_m: 1.0,
                  camera_height_m: 1.30}
    stickers: [cadera_izq, rodilla_izq, tobillo_izq, tobillo_der]
    segments:
      linea_hombros: [hombro_izq, hombro_der]
      linea_caderas: [cadera_izq, cadera_der]
      tronco: [cadera_der, hombro_der]
      brazo: [hombro_der, codo_der]
      antebrazo: [codo_der, muneca_der]
    joints:
      codo: [hombro_der, codo_der, muneca_der]
      rodilla_izq: [cadera_izq, rodilla_izq, tobillo_izq]
      rodilla: [cadera_der, rodilla_der, tobillo_der]          # lado de golpeo (eventos)
    linear: [muneca_der, cadera_izq, cadera_der]

serves:
  expected: 5
  reference_view: lateral      # vista donde se fecha el impacto (la pelota se ve contra el cielo)
  impact_method: ball          # ball = fin de la caída de la pelota | wrist = máx. rapidez de muñeca
  min_separation_s: 3.0
  pre_impact_s: 1.6            # ventana de cada saque alrededor del impacto
  post_impact_s: 0.8
  manual_impacts_s: {}         # ej. {lateral: [5.1, 13.4, ...]} para corregir la detección

filter:
  type: butterworth            # butterworth | savgol
  order: 2
  cutoff_hz: null              # null = análisis de residuos de Winter por marcador
  cutoff_range_hz: [4, 20]
  fallback_cutoff_hz: 10.0

qc:
  segment_length_tol: 0.6      # |L/L_mediana - 1| mayor -> hueco (error grosero; el escorzo 2D es gradual)
  segment_jump_tol: 0.30       # salto entre fotogramas > 30 % de la mediana -> hueco (el brazo a ~30 rad/s cambia hasta ~25 % por escorzo)
  max_marker_speed_m_s: 15.0   # desplazamiento entre fotogramas más rápido -> hueco
  max_omega_rad_s: 60.0        # ~3400 °/s en el plano; por encima = error de marcador o escorzo
  jump_z: 8.0
  jump_min_rel: 0.02
  max_gap_s: 0.05

events:
  start_frac: 0.05
  end_frac: 0.20
  sequence_margin_s: 0.05
  sequence_min_valid_frac: 0.5   # serie con <50 % de muestras válidas en la ventana -> sin pico (cadena incompleta)
  # Cadena próximo-distal (vista lateral): series cuyo pico se ordena en el tiempo.
  sequence:
    muslo: omega_seg_muslo
    tronco: omega_seg_tronco
    brazo: omega_seg_brazo
    codo: omega_interior_codo
    muneca: speed_muneca_der

# Indicadores por saque que se siguen a lo largo de la serie (posible fatiga).
fatigue:
  view: lateral
  min_valid_frac: 0.8          # picos con <80 % de muestras válidas en los 200 ms pre-impacto se excluyen
  # confidence: alta | media | baja. Los picos de ω del brazo dependen del QC (oclusiones y
  # escorzo 2D cerca del impacto): se reportan, pero no deben sostener conclusiones solos.
  # Las duraciones de fase (carga, aceleración, seguimiento) se agregan automáticamente.
  variables:
    rapidez_pico_muneca: {column: speed_muneca_der, stat: max, unit: m/s, confidence: media}
    omega_pico_codo: {column: omega_interior_codo, stat: absmax, unit: rad/s, confidence: baja}
    omega_pico_tronco: {column: omega_seg_tronco, stat: absmax, unit: rad/s, confidence: baja}
    omega_pico_hombro: {column: omega_interior_hombro, stat: absmax, unit: rad/s, confidence: baja}
    flexion_max_rodilla: {column: theta_interior_rodilla, stat: min, unit: rad, confidence: alta}
    elevacion_max_hombro: {column: theta_interior_hombro, stat: max, unit: rad, confidence: media}
    altura_max_muneca: {column: y_muneca_der, stat: max, unit: m, confidence: alta}

# Cuerpo completo: centro de masa (fracciones de Winter, ver analysis/body.py), fuerza vertical
# del suelo estimada F = m(a_CoM + g), posturas por evento, rango de movimiento y palancas.
body:
  com_cutoff_hz: 6.0           # filtro adicional del CoM antes de derivar dos veces
  posture_events: [inicio, inicio_flexion_rodilla, max_flex_rodilla, impacto, fin]
  lever_view: lateral
  lever_events: [max_flex_rodilla, impacto]
  lever_joints: [tobillo_der, rodilla_der, cadera_der, tobillo_izq, rodilla_izq, cadera_izq]

inverse_dynamics:
  enabled: true
  view: lateral
  # Supuestos exploratorios: GRF estimada por el CoM (sin plataforma) y muñeca sin carga externa.
  grf:
    mode: com                  # com = F = m(a_CoM + g) | none = GRF 0 (fase aérea)
    share: 0.5                 # fracción de la GRF en la pierna analizada (pies juntos en la carga)
    cop_frac: 0.5              # centro de presión: fracción del vector tobillo -> punta
    contact_bw: 0.2            # contacto si la GRF vertical de la pierna > 20 % de su parte del peso (ruido del CoM en vuelo)
  anthropometry:
    thigh_mass_fraction: 0.10
    shank_mass_fraction: 0.0465
    foot_mass_fraction: 0.0145
    upper_arm_mass_fraction: 0.0271
    forearm_mass_fraction: 0.0162
    thigh_com_fraction: 0.433
    shank_com_fraction: 0.433
    foot_com_fraction: 0.50
    upper_arm_com_fraction: 0.436
    forearm_com_fraction: 0.430
    thigh_gyration_fraction: 0.323
    shank_gyration_fraction: 0.302
    foot_gyration_fraction: 0.475
    upper_arm_gyration_fraction: 0.322
    forearm_gyration_fraction: 0.303
